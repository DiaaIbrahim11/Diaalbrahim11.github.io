<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diaa Ibrahim — Trader • Mentor • Educator</title>
<style>
:root{--bg:#061123;--card:#1B2B42;--line:#263B59;--blue:#3987FF;--soft:#78ACFF;--text:#F1F5F9;--muted:#A9B9CE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:0 20px 28px}
.hero{position:relative;margin:0 -20px;aspect-ratio:1024/760;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;
-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
h1{margin:-18px 0 0;text-align:center;font-weight:600;font-size:clamp(28px,8.4vw,42px);letter-spacing:.14em}
.role{margin:14px 0 0;text-align:center;color:var(--blue);font-weight:600;letter-spacing:.2em;font-size:clamp(11px,3.3vw,15px)}
.tag{margin:14px 0 0;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:clamp(9.5px,2.7vw,12px);letter-spacing:.16em;text-align:center;justify-content:center}
.tag::before,.tag::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line))}
.tag::after{transform:scaleX(-1)}
ul{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
a.row{display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 18px;border-radius:16px;text-decoration:none;color:inherit;
background:linear-gradient(135deg,#16233a,#101d33);border:1px solid var(--line);transition:transform .2s,border-color .2s,background .2s}
a.row:hover{border-color:var(--blue);transform:translateY(-2px);background:linear-gradient(135deg,#1B2B42,#14243b)}
a.row:active{transform:scale(.985)}
a.row:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:16px}
.txt span{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{width:20px;height:20px;color:var(--soft);flex:none;transition:transform .2s}
a.row:hover .arr{transform:translateX(4px)}
footer{margin-top:34px;display:flex;align-items:center;gap:14px;color:#6f84a3;font-size:11.5px;text-align:center}
footer::before,footer::after{content:"";height:1px;flex:1;background:var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
